name: quran_life_muslim
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  animated_flip_counter: ^0.3.4
  bloc: ^9.0.0
  delayed_display: ^2.0.0
  equatable: ^2.0.7
  flutter_bloc: ^9.0.0
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^19.1.0
  flutter_native_splash: ^2.2.18
  flutter_qiblah: ^3.1.0+1
  flutter_svg: ^2.2.0
  flutter_timezone: ^4.1.1
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  hijri: ^3.0.0
  http: ^1.3.0
  hydrated_bloc: ^10.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  syncfusion_flutter_datagrid: ^29.1.38
  syncfusion_flutter_datagrid_export: ^29.1.38

flutter_icons:
  android: true
  remove_alpha_ios: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 19

flutter_native_splash:
  image: 'assets/images/splash.png'
  color: "#FFFFFF"
  android: true
  ios: true
  fullscreen: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/json/
    - assets/fonts/
    - assets/sounds/note.ogg
    - assets/sounds/say.ogg
    - assets/sounds/prayer.ogg

###
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf

    - family: Reem_Kufi
      fonts:
        - asset: assets/fonts/Reem_Kufi/ReemKufiFun-VariableFont_wght.ttf

    - family: Uthmanic
      fonts:
        - asset: assets/fonts/Uthmanic/uthmanic_hafs_v22.ttf
        - asset: assets/fonts/Uthmanic/UthmanicHafs_V22.ttf

flutter_intl:
  enabled: true
